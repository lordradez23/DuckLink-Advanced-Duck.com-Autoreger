description = "Advanced high-performance asynchronous Duck.com email registration tool with AI captcha solving and stealth features."
authors = ["Lordradeez <Lordradeez@users.noreply.github.com>"]

readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
simplemail = "^1.0"
bs4 = "^0.0.2"
aiohttp = "^3.10.10"
simplegmail = "^4.1.1"
loguru = "^0.7.2"
